name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"

      - name: Install hash-locked dependencies without cache
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-build.txt

      - name: Run complete unit test gate
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run byte-compilation gate
        run: python -m py_compile pearipherals.py pearipherals_core.py magic_mouse_scroll.py pearipherals_snipping.py pearipherals_support.py pearipherals_version.py scripts/write_build_manifest.py scripts/write_version_info.py tests/test_core.py tests/test_release.py tests/test_snipping.py tests/test_support.py tests/test_magic_mouse_scroll.py
